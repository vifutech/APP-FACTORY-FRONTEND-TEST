
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP-FACTORY - Thử nghiệm</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 32px auto;
      padding: 16px;
      background: #f4f7fb;
      color: #1f2937;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #00000012;
    }

    h1 {
      color: #1769aa;
      margin-top: 0;
    }

    .subtitle {
      color: #64748b;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
    }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      background: #eef2f7;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border: 1px solid #dbe3ed;
      text-align: left;
    }

    th {
      background: #eaf3fc;
      color: #174f80;
    }

    tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    .hidden { display: none; }

    .count {
      margin-top: 12px;
      color: #64748b;
      font-size: 13px;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>APP-FACTORY</h1>
    <p class="subtitle">
      Trang thử nghiệm kết nối giao diện, Cloudflare Worker
      và Google Sheets.
    </p>

    <div class="actions">
      <button id="healthBtn" onclick="checkHealth()">
        1. Kiểm tra Backend
      </button>

      <button id="sheetsBtn" onclick="readSheets()">
        2. Đọc dữ liệu thiết bị
      </button>
    </div>

    <div id="status" role="status" aria-live="polite">
      Sẵn sàng. Anh hãy chọn một chức năng để kiểm tra.
    </div>

    <section id="tableSection" class="hidden">
      <h2>Dữ liệu đọc từ Google Sheets</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 80px">STT</th>
              <th>Nội dung</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div id="count" class="count"></div>
    </section>

    <footer>APP-FACTORY · Giao diện thử nghiệm</footer>
  </main>

  <script>
    const API_URL =
      "https://ancient-shadow-b537.phuvicemhatien.workers.dev";

    async function callApi(path) {
      const status = document.getElementById("status");
      const tableSection = document.getElementById("tableSection");
      const tableBody = document.getElementById("tableBody");
      const count = document.getElementById("count");
      const buttons = [
        document.getElementById("healthBtn"),
        document.getElementById("sheetsBtn")
      ];

      buttons.forEach(button => button.disabled = true);
      status.textContent = "Đang kết nối...";
      tableSection.classList.add("hidden");
      tableBody.replaceChildren();
      count.textContent = "";

      try {
        const response = await fetch(API_URL + path);
        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        if (path === "/api/health") {
          status.textContent =
            `Backend hoạt động tốt. Trạng thái: ${data.status}`;
          return;
        }

        if (!Array.isArray(data.rows)) {
          throw new Error("Dữ liệu trả về không đúng định dạng bảng.");
        }

        data.rows.forEach((row, index) => {
          const tr = document.createElement("tr");
          const numberCell = document.createElement("td");
          const valueCell = document.createElement("td");

          numberCell.textContent = index + 1;
          valueCell.textContent = Array.isArray(row)
            ? row.map(value => value ?? "").join(" | ")
            : String(row ?? "");

          tr.append(numberCell, valueCell);
          tableBody.appendChild(tr);
        });

        tableSection.classList.remove("hidden");
        count.textContent = `Tổng số dòng nhận được: ${data.rows.length}`;
        status.textContent = "Đọc dữ liệu thành công.";
      } catch (error) {
        status.textContent = "Có lỗi: " + error.message;
      } finally {
        buttons.forEach(button => button.disabled = false);
      }
    }

    function checkHealth() {
      callApi("/api/health");
    }

    function readSheets() {
      callApi("/api/sheets-range");
    }
  </script>
</body>
</html>
