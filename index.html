
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP-FACTORY - Kiểm tra kết nối</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #1f2937;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #00000012;
    }
    h1 { color: #1769aa; }
    button {
      padding: 12px 18px;
      margin: 6px 6px 6px 0;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #eef2f7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>APP-FACTORY</h1>
    <p>Trang thử nghiệm kết nối Cloudflare Worker và Google Sheets.</p>

    <button onclick="checkHealth()">1. Kiểm tra Backend</button>
    <button onclick="readSheets()">2. Đọc dữ liệu thiết bị</button>

    <div id="result">Nhấn một nút để bắt đầu kiểm tra.</div>
  </div>

  <script>
    const API_URL =
      "https://ancient-shadow-b537.phuvicemhatien.workers.dev";

    async function callApi(path) {
      const result = document.getElementById("result");
      result.textContent = "Đang kết nối...";
      try {
        const response = await fetch(API_URL + path);
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          "Không kết nối được: " + error.message;
      }
    }

    function checkHealth() {
      callApi("/api/health");
    }

    function readSheets() {
      callApi("/api/sheets-range");
    }
  </script>
</body>
</html>
